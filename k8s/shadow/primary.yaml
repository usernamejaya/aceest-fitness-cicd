apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-primary
  namespace: aceest
spec:
  replicas: 2
  selector:
    matchLabels:
      app: aceest-fitness
      role: primary
  template:
    metadata:
      labels:
        app: aceest-fitness
        role: primary
        version: "3.2.4"
    spec:
      containers:
        - name: aceest
          image: usernamejaya/aceest-fitness:3.2.4
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
          env:
            - name: APP_VERSION
              value: "3.2.4"
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 3
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: aceest-primary
  namespace: aceest
spec:
  type: NodePort
  selector:
    app: aceest-fitness
    role: primary
  ports:
    - name: http
      port: 80
      targetPort: 5000
      nodePort: 30083
