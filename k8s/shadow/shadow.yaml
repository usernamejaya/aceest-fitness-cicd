apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-shadow
  namespace: aceest
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aceest-fitness
      role: shadow
  template:
    metadata:
      labels:
        app: aceest-fitness
        role: shadow
        version: "3.1.2"
    spec:
      containers:
        - name: aceest
          image: usernamejaya/aceest-fitness:3.1.2
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
          env:
            - name: APP_VERSION
              value: "3.1.2"
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 3
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: aceest-shadow
  namespace: aceest
spec:
  type: ClusterIP
  selector:
    app: aceest-fitness
    role: shadow
  ports:
    - name: http
      port: 80
      targetPort: 5000
