apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-stable
  namespace: aceest
spec:
  replicas: 4
  selector:
    matchLabels:
      app: aceest-fitness
      track: canary-pool
      slot: stable
  template:
    metadata:
      labels:
        app: aceest-fitness
        track: canary-pool
        slot: stable
        version: "3.1.2"
    spec:
      containers:
        - name: aceest
          image: usernamejaya/aceest-fitness:3.1.2
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
          env:
            - name: APP_VERSION
              value: "3.1.2"
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 3
            periodSeconds: 5
